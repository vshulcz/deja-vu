    @keyframes dv-open { 0%, 87.9% { opacity: 1 } 88%, 90.4% { opacity: 0 } 90.5%, 95.9% { opacity: 1 } 96%, 99.4% { opacity: 0 } 99.5%, 100% { opacity: 1 } }
