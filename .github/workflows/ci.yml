name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeline:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - name: compile only
        shell: bash
        run: |
          date -u +%T
          time go test -count=1 -run '^$' ./... > /dev/null
          date -u +%T
      - name: run with timeline
        shell: bash
        run: |
          go test -json -timeout 25m ./... > timeline.json || true
          date -u +%T
      - name: cmd/deja slowest tests
        shell: bash
        run: |
          grep '"Action":"pass"' timeline.json | grep '"Test"' | grep -o '"Package":"[^"]*","Test":"[^"]*","Elapsed":[0-9.]*' | sort -t: -k4 -rn | head -40
          grep -E '"Action":"(start|pass|fail)","Package"' timeline.json | grep -v '"Test"' | head -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline
          path: timeline.json
