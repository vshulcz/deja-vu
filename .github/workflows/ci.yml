name: CI

on:
  push:
    branches: [main]
  # `labeled` is here because the windows leg is opt-in per pull request below,
  # and the default trigger set does not include it: labelling a PR would have
  # done nothing until someone happened to push another commit, which is the
  # worst kind of switch — one that looks connected.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly canary against fresh runner images

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # windows runs the suite about ten times slower than the others; the cap is
    # what turns a slow run into a cancellation that prints no test output.
    # 30 was the cap while the windows leg took 26m; on 2026-08-19 it reached
    # 29m30s and died with no output, so the margin is gone rather than the run
    # being unlucky. 45 keeps a real hang bounded — the go -timeout below still
    # kills one with a stack long before this.
    timeout-minutes: 45
    env:
      # Whether this leg does real work. The windows runner needs twenty-odd
      # minutes for a job the others finish in two, and it varies by a third
      # between identical runs, which is what tipped it over the cap and
      # produced cancellations that looked like hangs. Caching the build and
      # excluding it from Defender were both measured and neither helped
      # (#1229), so it comes off the per-commit path instead.
      #
      # It still runs on every push to main, on the weekly canary, on demand,
      # and on a pull request labelled `windows` — which is how a fix like
      # #1239 gets checked on the platform it is about.
      #
      # The leg is skipped from the inside rather than dropped from the matrix,
      # so `test / windows-latest` still reports and stays a required check.
      # Dropping it from the matrix would leave every unlabelled PR waiting on
      # a check that never arrives.
      FULL: ${{ matrix.os != 'windows-latest' || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.FULL == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.FULL == 'true'
        with:
          go-version: '1.25.x'
      - run: go mod verify
        if: env.FULL == 'true'
      - run: go vet ./...
        if: env.FULL == 'true'
      # -timeout below the job's own patience: a hung test then dies with every
      # goroutine's stack in the log, instead of the runner sitting on it until
      # the queue times out and the log says only "go test -race" (#838). Raised
      # to 12m as the suite grew — cmd/deja under -race on the windows runner
      # runs ~6m of real, non-hung work, and 12m keeps a wide margin below the
      # job's cap so a true hang still dies with a stack.
      # Coverage instrumentation is only read on Linux, where the floor runs.
      # Windows paid for -covermode=atomic on top of -race and threw the
      # profile away: the test step alone was 1726s of the job's 30m cap.
      - run: go test -race -timeout 12m -coverprofile=coverage.out -covermode=atomic ./...
        if: runner.os == 'Linux'
        shell: bash
      - run: go test -race -timeout 12m ./...
        if: runner.os == 'macOS'
        shell: bash
      # Windows runs the suite without -race. Of that leg's 26m17s, the tests
      # themselves were 5m16s and the other twenty minutes were compiling
      # race-instrumented objects — measured, not assumed (#1229). Two things
      # were tried first and neither moved it: rotating the build cache made it
      # slower, and excluding the build from Defender bought about a minute,
      # which is noise. The runner is simply that slow at this.
      #
      # Nothing is lost by dropping it here. Go's race detector finds races in
      # the scheduler's memory model, not in the operating system, so the same
      # race is caught on the linux and macOS legs above. Windows is in this
      # matrix for paths, file locking and case rules, and plain `go test`
      # exercises every one of those.
      - run: go test -timeout 12m ./...
        if: runner.os == 'Windows' && env.FULL == 'true'
        shell: bash
      - run: go build ./cmd/deja
        if: env.FULL == 'true'
      - name: Benchmark lexical recall floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          report=$(./deja bench recall --json)
          printf '%s\n' "$report"
          printf '%s\n' "$report" | jq -e '.lexical.recall_at_5 >= 0.85'
      # Printing coverage and failing on it are different things: the bar in
      # CONTRIBUTING said 95% while the number slid to 80%, because nothing
      # in the build ever looked at it. The floor here is where the packages
      # stand today — raise it as they improve, never lower it to pass.
      - name: Coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Measurement harnesses under scripts/ are developer tools, never
          # part of the binary, and they have no tests by design. Counting them
          # meant every new benchmark cost six points of coverage, so the gate
          # taxed measuring the product. Excluded here and the floor raised to
          # match what the shipped packages actually stand at.
          grep -v '/scripts/' coverage.out > shipped.out
          go tool cover -func=shipped.out | tail -1
          total=$(go tool cover -func=shipped.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=87.5
          echo "total coverage ${total}%, floor ${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { printf "coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1 } }'
      # A floor per package, set at where each stands today. Raise them as
      # coverage improves; lowering one to make a build pass is the move this
      # gate exists to prevent.
      #
      # Some have no room. bench and policy sit exactly on 100, so one uncovered
      # line fails the build, and usage has half a point — an exported one-line
      # wrapper with no caller was enough to trip it (#1921). If you are adding
      # a helper to one of those, add its test in the same commit.
      #
      # Every package with coverable statements is listed. The exception is
      # internal/jsonout, one const and no statements, which prints no coverage
      # line at all and so cannot be floored.
      #
      # Eight packages had no floor until #1956, five of them fully covered.
      # The total floor of 87.5% is not a substitute: prompt sat at 84.8% under
      # it for months without a word. Every floor here is set at today's number
      # rounded down, which in a small package means one uncovered statement
      # fails the build — cjkfold is 74 statements, model is 10. Adding a
      # helper to any of these means adding its test in the same commit.
      - name: Per-package coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          declare -A floor=(
            [cmd/deja]=88 [internal/atomicfile]=77 [internal/bench]=100
            [internal/cjkfold]=100 [internal/digest]=90 [internal/embed]=93
            [internal/index]=90 [internal/mark]=98 [internal/model]=100
            [internal/nfcfold]=100 [internal/peers]=76 [internal/policy]=100
            [internal/prompt]=84 [internal/query]=100 [internal/redact]=94
            [internal/search]=93 [internal/sources]=87 [internal/stats]=91
            [internal/termwidth]=100 [internal/usage]=95
          )
          fail=0
          while read -r pkg cov; do
            short=${pkg#github.com/vshulcz/deja-vu/}
            want=${floor[$short]:-0}
            if awk -v c="$cov" -v f="$want" 'BEGIN { exit !(c+0 < f+0) }'; then
              echo "$short: $cov% below floor $want%"
              fail=1
            else
              echo "$short: $cov% (floor $want%)"
            fi
          done < <(go test -coverprofile=/dev/null ./... 2>/dev/null | awk '/^ok/ { for(i=1;i<=NF;i++) if($i=="coverage:"){gsub("%","",$(i+1)); print $2, $(i+1)} }')
          exit $fail

  e2e:
    name: e2e smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - run: sh scripts/e2e.sh

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build all release targets
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/deja
            done
          done

  mcpb:
    name: mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Pack a bundle
        run: |
          mkdir -p dist/deja_linux_amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/deja_linux_amd64/deja ./cmd/deja
          go run ./scripts/mcpb -version 0.0.0-ci -in dist -out dist/mcpb
      # The manifest is validated against the published schema rather than our
      # reading of it: a bundle that fails here would fail on a user's machine
      # with nothing to explain why.
      - name: Validate against the official schema
        run: |
          npx -y @anthropic-ai/mcpb@latest unpack dist/mcpb/deja-vu_0.0.0-ci_linux_amd64.mcpb dist/unpacked
          npx -y @anthropic-ai/mcpb@latest validate dist/unpacked/manifest.json
      - name: Start the server straight out of the bundle
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | dist/unpacked/server/deja mcp | tee /tmp/out.json
          grep -q '"serverInfo"' /tmp/out.json

  manifests:
    name: windows manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      # scoop and winget carry a version and two hashes that are updated after
      # a release. That step is invisible when skipped — v0.16.0 shipped with
      # them still on 0.15.6 — so it is checked rather than remembered.
      - name: Manifests match the newest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/pinmanifests -check

      # The logo, the dark logo and the icon are drawn from the sprite in
      # internal/mark. Editing the sprite without regenerating is silent: the
      # terminal banner changes and the assets do not.
      - name: SVG assets match the sprite
        run: go run ./scripts/genlogo -check

      # .gitignore is what stops `go build ./scripts/<name>` binaries riding
      # along in a commit, and it had drifted seven names short of the packages
      # it claimed to cover.
      - name: Every scripts/ binary is ignored
        run: go run ./scripts/ignorecheck

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
          # Without this, setup-go stops at whatever Go the runner image
          # already carries, because it satisfies 1.25.x — and that is a
          # patch or two behind. Every standard-library advisory then fails
          # this job on a fix that is already released: five of them, all
          # fixed in 1.25.13, against an image carrying 1.25.12. The other
          # jobs keep the cached toolchain; this is the one that has to be
          # on the newest patch to mean anything.
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish,sign
      - run: node --check scripts/release-npm.mjs

  scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    # Without this the job's ceiling is six hours. Installing shellcheck through
    # apt hung twice in a row on 2026-08-18 and each hang blocked every merge
    # until someone cancelled the run by hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: |
          # Preinstalled on the ubuntu runner image; installing it again bought
          # nothing and was the step that hung.
          shellcheck --version
          shellcheck install.sh scripts/e2e.sh
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
