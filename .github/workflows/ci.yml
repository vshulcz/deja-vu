name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [trace, verbose, count1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - run: go vet ./...
      - if: matrix.mode == 'trace'
        shell: bash
        run: |
          date -u +%T
          go test -debug-trace="$RUNNER_TEMP/trace.json" -timeout 25m ./... > "$RUNNER_TEMP/plain.txt" 2>&1; echo "exit $?"
          date -u +%T
          grep -E "^(ok|FAIL|---)" "$RUNNER_TEMP/plain.txt" | head -30
      - if: matrix.mode == 'verbose'
        shell: bash
        run: |
          date -u +%T
          go test -v -timeout 25m ./... > "$RUNNER_TEMP/plain.txt" 2>&1; echo "exit $?"
          date -u +%T
      - if: matrix.mode == 'count1'
        shell: bash
        run: |
          date -u +%T
          go test -count=1 -timeout 25m ./... > "$RUNNER_TEMP/plain.txt" 2>&1; echo "exit $?"
          date -u +%T
          grep -E "^(ok|FAIL|---)" "$RUNNER_TEMP/plain.txt" | head -30
      - if: always() && matrix.mode == 'trace'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace
          path: ${{ runner.temp }}/trace.json
