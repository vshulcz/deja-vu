name: CI

on:
  push:
    branches: [main]
  # `labeled` is here because the windows leg is opt-in per pull request below,
  # and the default trigger set does not include it: labelling a PR would have
  # done nothing until someone happened to push another commit, which is the
  # worst kind of switch — one that looks connected.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly canary against fresh runner images

permissions:
  contents: read

concurrency:
  # Only a new push cancels the run before it. A pull request opened with a
  # label fires `opened` and `labeled` in the same second, and cancelling one of
  # those leaves a cancelled check run on the commit beside the successful one:
  # branch protection reads both and refuses the merge of a green pull request,
  # which is what #3504 sat on. A superseded push is still worth cancelling —
  # that is the case this is for.
  #
  # The distinction lives here and not in the group: keying the group on the
  # event action instead made the workflow fail to start at all, with no job and
  # no log (run 34748731350).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  # Whether the windows leg runs the suite, decided here rather than from the
  # event that started this run.
  #
  # It was `contains(github.event.pull_request.labels.*.name, 'windows')` in the
  # matrix job's env, which is the payload of the triggering event: a PR opened
  # and labelled a second later has one run without the label and — when the
  # `labeled` event produces a run at all — one with it. #3693 was labelled
  # `windows`, its `test / windows-latest` check reported success having skipped
  # every step in four seconds, and the three tests that leg would have caught
  # turned main red on the next push (#3699, #3707).
  #
  # The label is still added for a branch that touches what has broken this leg
  # before, so nobody has to think of it, and it is still honoured when someone
  # adds it by hand. The difference is that the decision and the checks now come
  # out of the same run.
  windows-leg:
    name: windows leg
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      full: ${{ steps.decide.outputs.full }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          full() {
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "windows leg: running the whole suite — $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$EVENT" != "pull_request" ]; then
            full "every push to main, the weekly canary and a manual run take it"
          fi
          labels=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,windows,*) full "the pull request carries the \`windows\` label" ;;
          esac
          # What has actually broken this leg: the store paths a parser reads
          # (they end up in printed tables and in path handling), the generated
          # registry pages beside them, anything about the filesystem or the
          # index layout, and this workflow. Nobody labels a parser change
          # `windows`, because it does not look like one — #3467 grew a printed
          # table past a windows pipe's buffer and deadlocked the suite on main.
          # `gh pr diff` refuses a diff of more than 300 files, which failed
          # this job and skipped every test leg behind it (#4511). The files
          # API pages up to 3000; a branch past that takes the suite.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            full "the diff is too large to list"
          fi
          want=$(printf '%s\n' "$files" | grep -E \
            -e '^internal/sources/' \
            -e '^internal/index/' \
            -e '^docs/registry/' \
            -e '^\.github/workflows/ci\.yml$' \
            -e '^cmd/deja/(doctor|install|sources|files|restore)' \
            || true)
          if [ -n "$want" ]; then
            printf '%s\n' "$want" | while IFS= read -r f; do echo "  $f"; done
            if [ "$DRAFT" != "true" ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label windows || true
            fi
            full "this branch touches paths that have broken it before"
          fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          {
            echo "windows leg: **building only** — nothing here has broken it before."
            echo ""
            echo "Label the pull request \`windows\` to run the whole suite on it."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      # The shard matrix for the test legs, and the one place the shard count
      # is set. A windows leg that only builds is one job, not three.
      - name: Shards
        id: shards
        env:
          FULL: ${{ steps.decide.outputs.full }}
        run: |
          set -euo pipefail
          of=3
          matrix=$(jq -cn --argjson of "$of" --arg full "$FULL" '{include: [
            ("ubuntu-latest", "macos-latest", "windows-latest") as $os
            | range(1; $of + 1) as $i
            | select($os != "windows-latest" or $full == "true" or $i == 1)
            | {os: $os, shard: $i, of: $of}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
        shell: bash

  # The suite runs in shards per OS, cut by test name (see
  # scripts/testshard), and the `test / <os>` job further down reports for all
  # of them. cmd/deja is over three thousand tests in one binary and a package's
  # tests run one after another, so the whole leg was as long as that package:
  # 1005s of the 24m macOS leg on run 37061621425 (#4609).
  test-shard:
    needs: windows-leg
    name: test ${{ matrix.shard }}/${{ matrix.of }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # windows runs the suite about ten times slower than the others; the cap is
    # what turns a slow run into a cancellation that prints no test output.
    # 30 was the cap while the windows leg took 26m; on 2026-08-19 it reached
    # 29m30s and died with no output, so the margin is gone rather than the run
    # being unlucky. On 2026-09-09 two runs of the same commit came in at 12m10s
    # and past 45m — the step that ran over is `go test`, whose own timeout
    # covers running tests and not compiling them, so a cold cache on a slow
    # runner spends the difference in the compiler. 60 went the same way on
    # 2026-09-12: the leg cancelled at 1h2m53s on main having passed at 49m18s
    # and 57m2s on the two pull requests before it. Where that time goes,
    # measured on the passing run: the test step is 48m27s, of which 13m is the
    # tests themselves (cmd/deja 612s, internal/index 124s, every other package
    # under 40s) and 35m is compiling and linking test binaries. Caching the
    # build and excluding it from Defender were both measured and neither helped
    # (#1229). 90 lasted nine days: on 2026-09-21 main passed at 1h26m00s with
    # the test step at 5096s, and the pull request behind it was cancelled at
    # 1h30m14s with the step at 5358s — the same commit range, four minutes
    # apart, one on either side of the cap. That run's own numbers say where the
    # time is not: every package reported ok, and the test seconds add up to
    # 1252s (cmd/deja 941s, internal/index 193s, internal/usage 51s, all 25
    # others under 24s), so 21 minutes of the 89 is tests and the rest is the
    # compiler and the linker again. So the cap is 120 — a real hang is still
    # bounded by the go -timeout below, which kills one with a stack long
    # before this. The run that raised it came in at 1h28m43s, so 120 is about
    # a third of headroom rather than a comfortable margin. The compiler reading
    # was wrong: compiling every test binary on the runner is 41s, and the leg
    # came down to about a quarter of an hour once `go test` ran with -count=1
    # (see the windows test step).
    timeout-minutes: 120
    env:
      # Whether this leg does real work. The windows runner needs twenty-odd
      # minutes for a job the others finish in two, and it varies by a third
      # between identical runs, which is what tipped it over the cap and
      # produced cancellations that looked like hangs. Caching the build and
      # excluding it from Defender were both measured and neither helped
      # (#1229), so it comes off the per-commit path instead.
      #
      # It still runs on every push to main, on the weekly canary, on demand,
      # and on a pull request labelled `windows` — which is how a fix like
      # #1239 gets checked on the platform it is about.
      #
      # The leg is skipped from the inside rather than dropped from the matrix,
      # so `test / windows-latest` still reports and stays a required check.
      # Dropping it from the matrix would leave every unlabelled PR waiting on
      # a check that never arrives.
      #
      # And when it is skipped it still builds: a check that ran nothing and
      # says success is indistinguishable from one that passed, which is how
      # #3693 was merged. `go build ./cmd/deja` on windows is two minutes and
      # makes the green mean something — the platform's own compiler saw this
      # commit.
      FULL: ${{ matrix.os != 'windows-latest' || needs.windows-leg.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      # os × shard, from the windows-leg job.
      matrix: ${{ fromJSON(needs.windows-leg.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit-trailer test reads the last sixty messages; a depth of
          # one shows it only the merge commit.
          fetch-depth: 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go mod verify
        if: env.FULL == 'true' && matrix.shard == 1
      - run: go vet ./...
        if: env.FULL == 'true' && matrix.shard == 1
      # A range of test names rather than a list: a thousand names do not fit
      # on a windows command line, and a range also takes in any test the
      # scanner missed. Every test lands in exactly one shard.
      - name: Pick this shard's tests
        id: pick
        if: env.FULL == 'true'
        run: go run ./scripts/testshard -shard ${{ matrix.shard }} -of ${{ matrix.of }} >> "$GITHUB_OUTPUT"
        shell: bash
      # -timeout below the job's own patience: a hung test then dies with every
      # goroutine's stack in the log, instead of the runner sitting on it until
      # the queue times out and the log says only "go test -race" (#838).
      #
      # 20m, because 12m had stopped being a hang detector here the way it had
      # on windows earlier. Measured on three runs of the same suite: the macOS
      # test job took 643s, 753s and then 814s, the last one killed at the 12m
      # cap with nothing stuck, and the ubuntu job was at 779-797s beside it.
      # Both legs were running eleven to twelve minutes of honest work against
      # a twelve-minute cap, which fails on runner speed rather than on a bug.
      # The job's own 90m cap is what bounds a real hang; a go timeout at 20m
      # still dies with every goroutine's stack well inside it.
      #
      # Coverage instrumentation is only read on Linux, where the floor runs.
      # Windows paid for -covermode=atomic on top of -race and threw the
      # profile away: the test step alone was 1726s of the job's 30m cap.
      #
      # -count=1 for the reason given at the windows step below: with the test
      # cache on, every test binary logs each file and variable it touches, and
      # cmd/deja's log is over a gigabyte. On run 37061621425 the macOS step was
      # 1422s around a cmd/deja that reported 1005s, and ubuntu 859s around
      # 706s. A fresh runner never reuses a cached result anyway.
      - run: go test -race -count=1 -timeout 20m -coverprofile=coverage.out -covermode=atomic -run "$RUN" -skip "$SKIP" ./...
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUN: ${{ steps.pick.outputs.run }}
          SKIP: ${{ steps.pick.outputs.skip }}
      - run: go test -race -count=1 -timeout 20m -run "$RUN" -skip "$SKIP" ./...
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUN: ${{ steps.pick.outputs.run }}
          SKIP: ${{ steps.pick.outputs.skip }}
      # Windows runs the suite without -race. Of that leg's 26m17s, the tests
      # themselves were 5m16s and the other twenty minutes were compiling
      # race-instrumented objects — measured, not assumed (#1229). Two things
      # were tried first and neither moved it: rotating the build cache made it
      # slower, and excluding the build from Defender bought about a minute,
      # which is noise. The runner is simply that slow at this.
      #
      # Nothing is lost by dropping it here. Go's race detector finds races in
      # the scheduler's memory model, not in the operating system, so the same
      # race is caught on the linux and macOS legs above. Windows is in this
      # matrix for paths, file locking and case rules, and plain `go test`
      # exercises every one of those.
      #
      # The windows timeout is 25m rather than 12m because 12m stopped being a
      # hang detector and started cutting honest work: run 34663347144 killed
      # cmd/deja at 720.087s with the test it had just entered at 0s, so nothing
      # was stuck — the package simply needs more than twelve minutes on a slow
      # runner now. The job's own 120m cap is what bounds a real hang, and the go
      # timeout still dies with every goroutine's stack well inside it.
      #
      # Narrowing this to `./cmd/... ./internal/...` was tried and reverted.
      # The 31 packages under scripts/ are build tooling that never runs on
      # windows, and locally they are a quarter of the compile work — a cold
      # `go test -run <nothing>` is 22s over every package against 16s without
      # them. On the runner that quarter does not exist: 5358s for the step with
      # them against 5259s without, one run each, which is inside a leg whose
      # identical runs have come in at 49m, 57m and 62m. Not worth a narrower
      # leg, and not worth measuring again.
      #
      # -count=1 is what makes this leg a quarter of an hour instead of an hour
      # and a half. With the test cache on, `go test` has each test binary log
      # every file and variable it touches, to key the cached result; on the
      # runner cmd/deja's log is 1.26 GB, 25M lines. A -debug-trace of the plain
      # step shows every build done in the first minute and the cmd/deja test
      # action running 5434s around a binary that reported 912s. Not the tests
      # and not the keying: replaying cmd/go's hashing over that log on the runner
      # is 10s, and the binary with the log written to D: is 12 minutes. Where
      # exactly go test spends the rest of it is not pinned down; -count=1 turns
      # the log off. On 2026-09-26 the step took 10-15 minutes with it on four
      # runners in centralus, eastus, eastus2 and northcentralus, where it had
      # taken 43-94 minutes before. A fresh runner never reuses a cached test
      # result, so nothing is lost.
      - run: go test -count=1 -timeout 25m -run "$RUN" -skip "$SKIP" ./...
        if: runner.os == 'Windows' && env.FULL == 'true'
        shell: bash
        env:
          RUN: ${{ steps.pick.outputs.run }}
          SKIP: ${{ steps.pick.outputs.skip }}
      - run: go build ./cmd/deja
        if: matrix.shard == 1
      - name: Benchmark lexical recall floor
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        shell: bash
        run: |
          report=$(./deja bench recall --json)
          printf '%s\n' "$report"
          printf '%s\n' "$report" | jq -e '.lexical.recall_at_5 >= 0.85'
      # What an update costs, per class of change. The four quality benchmarks
      # all measure what comes back; the event that happens most — a new
      # conversation appears on disk — had no number anywhere, which is how a
      # path that re-tokenised the entire store on every new session survived
      # two months and twenty releases (#3500, fixed in #3503).
      #
      # The gate is the shape rather than the clock: only a transcript that was
      # rewritten may make the pass replace the records already on file. A
      # wall-clock budget on a shared runner measures the runner, which is the
      # lesson #3590 cost a red pull request to learn.
      - name: Ingest cost per class of change
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        shell: bash
        run: |
          report=$(./deja bench ingest --json)
          printf '%s\n' "$report"
          # Nothing but a rewrite rewrites.
          printf '%s\n' "$report" | jq -e '
            [.classes[] | select(.name != "rewritten transcript") | .rewritten]
            | length > 0 and all(. == false)'
          # And the rewrite class is still there to be compared against, so a
          # renamed or removed class cannot make the check above vacuous.
          printf '%s\n' "$report" | jq -e '
            [.classes[] | select(.name == "rewritten transcript" and .rewritten)]
            | length == 1'
          # And every class is present. A wall-clock comparison stood here and
          # failed on the runner while the local margin was five-fold — which
          # is the lesson above, applied to this step rather than quoted by it.
          # What the gate can hold on a shared machine is the shape: the five
          # classes exist, and only one of them rewrites.
          printf '%s\n' "$report" | jq -e '
            [.classes[].name] | sort == [
              "appended turn", "new transcript", "renamed transcript",
              "rewritten transcript", "unchanged"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage.out
          retention-days: 3
          # A re-run of this shard replaces what the earlier attempt left.
          overwrite: true

  # One check per OS under the name branch protection requires, passing only
  # when every shard of that OS did. On Linux it also merges the shards'
  # coverage and holds it to the floors: a block listed by several shards
  # counts as covered if any of them covered it, so the merged profile is the
  # one a single run would have written.
  test:
    needs: [windows-leg, test-shard]
    if: ${{ !cancelled() }}
    name: test / ${{ matrix.os }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OS: ${{ matrix.os }}
      MATRIX: ${{ needs.windows-leg.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          go-version: '1.26.x'
          cache: false
      # Read from the run's jobs rather than from what the shards uploaded:
      # artifacts belong to the run, not the attempt, so after a re-run a
      # shard that failed would still have the first attempt's files.
      # filter=latest is each job's newest attempt.
      - name: Every shard passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          want=$(jq -r --arg os "$OS" '.include[] | select(.os == $os) | "test \(.shard)/\(.of) / \(.os)"' <<<"$MATRIX")
          if [ -z "$want" ]; then
            echo "::error::no shards were planned for $OS"
            exit 1
          fi
          got=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | "\(.name)\t\(.conclusion // .status)"')
          fail=0
          while IFS= read -r name; do
            c=$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' <<<"$got" | tail -1)
            echo "$name: ${c:-missing}"
            if [ "$c" != success ]; then
              echo "::error::$name: ${c:-missing}"
              fail=1
            fi
          done <<<"$want"
          exit $fail
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          pattern: coverage-*
          path: shards
      - name: Merge the shards' coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          n=$(jq --arg os "$OS" '[.include[] | select(.os == $os)] | length' <<<"$MATRIX")
          {
            echo "mode: atomic"
            for i in $(seq 1 "$n"); do grep -v '^mode:' "shards/coverage-$i/coverage.out"; done
          } > coverage.out
      # Printing coverage and failing on it are different things: the bar in
      # CONTRIBUTING said 95% while the number slid to 80%, because nothing
      # in the build ever looked at it. The floor here is where the packages
      # stand today — raise it as they improve, never lower it to pass.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Measurement harnesses under scripts/ are developer tools, never
          # part of the binary, and they have no tests by design. Counting them
          # meant every new benchmark cost six points of coverage, so the gate
          # taxed measuring the product. Excluded here and the floor raised to
          # match what the shipped packages actually stand at.
          grep -v '/scripts/' coverage.out > shipped.out
          go tool cover -func=shipped.out | tail -1
          total=$(go tool cover -func=shipped.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=87.5
          echo "total coverage ${total}%, floor ${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { printf "coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1 } }'
      # A floor per package, set at where each stands today. Raise them as
      # coverage improves; lowering one to make a build pass is the move this
      # gate exists to prevent.
      #
      # Some have no room. bench and policy sit exactly on 100, so one uncovered
      # line fails the build, and usage has half a point — an exported one-line
      # wrapper with no caller was enough to trip it (#1921). If you are adding
      # a helper to one of those, add its test in the same commit.
      #
      # Every package with coverable statements is listed. The exception is
      # internal/jsonout, one const and no statements, which prints no coverage
      # line at all and so cannot be floored.
      #
      # Eight packages had no floor until #1956, five of them fully covered.
      # The total floor of 87.5% is not a substitute: prompt sat at 84.8% under
      # it for months without a word. Every floor here is set at today's number
      # rounded down, which in a small package means one uncovered statement
      # fails the build — cjkfold is 74 statements, model is 10. Adding a
      # helper to any of these means adding its test in the same commit.
      #
      # The numbers come from the profile the test step already wrote. This
      # used to run the whole suite a second time, without -race, only to read
      # the "coverage:" line go test prints per package: 293s of the ubuntu
      # leg on run 37061621425. The awk below is that figure: statements in
      # covered blocks over all statements, one decimal. A block listed twice
      # counts once, covered if either listing covered it. scripts/ has no
      # floors, as in the total above.
      - name: Per-package coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          declare -A floor=(
            [cmd/deja]=88 [internal/atomicfile]=77 [internal/bench]=100
            [internal/cjkfold]=100 [internal/digest]=90 [internal/embed]=93
            [internal/harnesscolor]=100 [internal/index]=90 [internal/mark]=98 [internal/model]=100
            [internal/nfcfold]=100 [internal/peers]=76 [internal/policy]=100
            [internal/prompt]=84 [internal/query]=100 [internal/redact]=94
            [internal/search]=93 [internal/sources]=87 [internal/stats]=91
            [internal/termwidth]=100 [internal/tui]=88 [internal/usage]=95
          )
          fail=0
          declare -A seen=()
          while read -r pkg cov; do
            short=${pkg#github.com/vshulcz/deja-vu/}
            seen[$short]=1
            want=${floor[$short]:-0}
            if awk -v c="$cov" -v f="$want" 'BEGIN { exit !(c+0 < f+0) }'; then
              echo "$short: $cov% below floor $want%"
              fail=1
            else
              echo "$short: $cov% (floor $want%)"
            fi
          done < <(grep -v '/scripts/' coverage.out | awk '
            $1 != "mode:" {
              pkg = $1; sub(/:[^:]*$/, "", pkg); sub(/\/[^\/]*$/, "", pkg)
              if (!($1 in stmts)) { stmts[$1] = $2; total[pkg] += $2 }
              if ($3 > 0 && !($1 in hit)) { hit[$1] = 1; covered[pkg] += $2 }
            }
            END { for (p in total) if (total[p] > 0) printf "%s %.1f\n", p, 100 * covered[p] / total[p] }
          ' | sort)
          # A floored package the profile does not mention was not measured,
          # which is not the same as passing.
          for short in "${!floor[@]}"; do
            if [ -z "${seen[$short]:-}" ]; then
              echo "$short: not in the coverage profile"
              fail=1
            fi
          done
          exit $fail

  e2e:
    name: e2e smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - run: sh scripts/e2e.sh

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build all release targets
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/deja
            done
          done

  mcpb:
    name: mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Pack a bundle
        run: |
          mkdir -p dist/deja_linux_amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/deja_linux_amd64/deja ./cmd/deja
          go run ./scripts/mcpb -version 0.0.0-ci -in dist -out dist/mcpb
      # The manifest is validated against the published schema rather than our
      # reading of it: a bundle that fails here would fail on a user's machine
      # with nothing to explain why.
      - name: Validate against the official schema
        run: |
          npx -y @anthropic-ai/mcpb@latest unpack dist/mcpb/deja-vu_0.0.0-ci_linux_amd64.mcpb dist/unpacked
          npx -y @anthropic-ai/mcpb@latest validate dist/unpacked/manifest.json
      - name: Start the server straight out of the bundle
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | dist/unpacked/server/deja mcp | tee /tmp/out.json
          grep -q '"serverInfo"' /tmp/out.json

  manifests:
    name: windows manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      # scoop and winget carry a version and two hashes that are updated after
      # a release. That step is invisible when skipped — v0.16.0 shipped with
      # them still on 0.15.6 — so it is checked rather than remembered.
      - name: Manifests match the newest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/pinmanifests -check

      # The logo, the dark logo and the icon are drawn from the sprite in
      # internal/mark. Editing the sprite without regenerating is silent: the
      # terminal banner changes and the assets do not.
      - name: SVG assets match the sprite
        run: go run ./scripts/genlogo -check

      # .gitignore is what stops `go build ./scripts/<name>` binaries riding
      # along in a commit, and it had drifted seven names short of the packages
      # it claimed to cover.
      - name: Every scripts/ binary is ignored
        run: go run ./scripts/ignorecheck

  stale:
    name: not behind on what it touches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # merge-base needs the history of both sides.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      # A squash merge applies the branch's own diff, so a branch cut before
      # another PR landed silently restores that PR's old lines — mergeable,
      # green, reviewed, and a revert (#2911). Requiring every branch to be up
      # to date prevents it and costs a rebase per PR; this asks for one only
      # where the base has moved on a file the branch also touches.
      - name: Rebase needed on the files this branch changes
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          go run ./scripts/staleoverlap -base "origin/${{ github.event.pull_request.base.ref }}" -head HEAD

  sitemap:
    name: sitemap dates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The check reads the commit that last touched each page. The test
          # matrix clones sixty deep, where a page older than that looks
          # untouched and the check passes by seeing nothing.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Sitemap lastmod follows the pages
        run: go test ./cmd/deja -run TestSitemapLastmodFollowsThePages -count 1

  generated:
    name: generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # genregistry dates every page from the commit that last touched it,
          # and refuses a shallow clone rather than stamping the boundary
          # commit's date on all of them.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      # The nav, the support matrix, the registry pages and the feed are
      # generated and committed. Nothing asserted the committed copy was what
      # the generator writes today, so a stale one stayed green: docs/feed.xml
      # went two days without a page the sitemap listed, and docs/sitemap.xml
      # carried a date a day behind the commit it names (#3984). The tests
      # beside these check properties, not bytes.
      - name: The generators write what is committed
        run: |
          go run ./scripts/gennav
          go run ./scripts/genmatrix
          go run ./scripts/genregistry
          go run ./scripts/genfeed
          # --porcelain rather than `git diff`, because a generator that adds a
          # page writes an untracked file and a diff of tracked files does not
          # see it: genregistry writes one per harness, so the first run after a
          # parser lands is exactly the case this has to catch.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A generated file is not what its generator writes. Run:"
            echo "::error::  go run ./scripts/gennav && go run ./scripts/genmatrix && go run ./scripts/genregistry && go run ./scripts/genfeed"
            git --no-pager status --short
            git --no-pager diff --stat
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
          # Without this, setup-go stops at whatever Go the runner image
          # already carries, because it satisfies 1.26.x — and that is a
          # patch or two behind. Every standard-library advisory then fails
          # this job on a fix that is already released: five of them, all
          # fixed in 1.25.13, against an image carrying 1.25.12. The other
          # jobs keep the cached toolchain; this is the one that has to be
          # on the newest patch to mean anything.
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish,sign
      - run: node --check scripts/release-npm.mjs
      - run: node --check scripts/release-clawhub-auth.mjs
      - run: node --test scripts/release_clawhub_auth_test.mjs

  scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    # Without this the job's ceiling is six hours. Installing shellcheck through
    # apt hung twice in a row on 2026-08-18 and each hang blocked every merge
    # until someone cancelled the run by hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: |
          # Preinstalled on the ubuntu runner image; installing it again bought
          # nothing and was the step that hung.
          shellcheck --version
          shellcheck install.sh scripts/e2e.sh
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
