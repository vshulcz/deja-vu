name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeline:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - name: go vet (as CI)
        run: go vet ./...
      - name: plain go test (exact CI command)
        shell: bash
        run: |
          date -u +%T
          set +e
          go test -timeout 25m ./... > plain.txt 2>&1
          echo "exit $?"
          date -u +%T
          grep -E "^(ok|FAIL|---)" plain.txt | head -40
      - name: go test -json -count=1
        shell: bash
        run: |
          date -u +%T
          set +e
          go test -json -count=1 -timeout 25m ./... > timeline.json
          echo "exit $?"
          date -u +%T
          grep -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' timeline.json > pkgs.txt || true
          cat pkgs.txt | cut -c1-200
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline
          path: |
            timeline.json
            plain.txt
