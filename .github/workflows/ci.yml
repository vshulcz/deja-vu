name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # weekly canary against fresh runner images

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        shell: bash
      - run: go build ./cmd/deja
      - name: Benchmark lexical recall floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          report=$(./deja bench recall --json)
          printf '%s\n' "$report"
          printf '%s\n' "$report" | jq -e '.lexical.recall_at_5 >= 0.85'
      # Printing coverage and failing on it are different things: the bar in
      # CONTRIBUTING said 95% while the number slid to 80%, because nothing
      # in the build ever looked at it. The floor here is where the packages
      # stand today — raise it as they improve, never lower it to pass.
      - name: Coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=82.0
          echo "total coverage ${total}%, floor ${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { printf "coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1 } }'
      # A floor per package, set at where each stands today. Raise them as
      # coverage improves; lowering one to make a build pass is the move this
      # gate exists to prevent.
      - name: Per-package coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          declare -A floor=(
            [cmd/deja]=88 [internal/bench]=100 [internal/digest]=90 [internal/embed]=93
            [internal/index]=87 [internal/policy]=88 [internal/redact]=94
            [internal/search]=89 [internal/sources]=87 [internal/usage]=95
          )
          fail=0
          while read -r pkg cov; do
            short=${pkg#github.com/vshulcz/deja-vu/}
            want=${floor[$short]:-0}
            if awk -v c="$cov" -v f="$want" 'BEGIN { exit !(c+0 < f+0) }'; then
              echo "$short: $cov% below floor $want%"
              fail=1
            else
              echo "$short: $cov% (floor $want%)"
            fi
          done < <(go test -coverprofile=/dev/null ./... 2>/dev/null | awk '/^ok/ { for(i=1;i<=NF;i++) if($i=="coverage:"){gsub("%","",$(i+1)); print $2, $(i+1)} }')
          exit $fail

  e2e:
    name: e2e smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: sh scripts/e2e.sh

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build all release targets
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/deja
            done
          done

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish,sign
      - run: node --check scripts/release-npm.mjs

  scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck install.sh scripts/e2e.sh
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
