name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [pwsh-exact, bash-file, json]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - run: go vet ./...
      # exactly what ci.yml runs on windows: default shell (pwsh), output to the console
      - if: matrix.mode == 'pwsh-exact'
        run: go test -timeout 25m ./...
      - if: matrix.mode == 'bash-file'
        shell: bash
        run: |
          go test -timeout 25m ./... > plain.txt 2>&1; echo "exit $?"
          grep -E "^(ok|FAIL|---)" plain.txt | head -40
      - if: matrix.mode == 'json'
        shell: bash
        run: |
          go test -json -timeout 25m ./... > timeline.json; echo "exit $?"
          grep -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' timeline.json | cut -c1-200 || true
      - if: always() && matrix.mode == 'json'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline
          path: timeline.json
