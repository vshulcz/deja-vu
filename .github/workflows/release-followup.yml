name: Release follow-up

# A release leaves two things for the repository to catch up on, and both are
# manual: the Windows manifests are regenerated and attached to the release but
# never committed back, and each published extension's version is decided by npm
# and written into a temporary copy. On 15 September 2026 both were forgotten
# after v0.20.1 — the manifests turned every later pull request red, which is how
# anyone found out, and all four extension versions had been behind for releases
# before that with nothing saying so (#3624, #3627).
#
# So the reminder arrives with the release rather than with the next pull
# request, and with RELEASE_PIN_TOKEN set the catch-up arrives with it as a pull
# request: after v0.23.2 the drift step was forgotten again and the pin PR went
# red twice, the second time on a package npm served minutes later (#5746).
#
# RELEASE_PIN_TOKEN is a fine-grained PAT on this repository with contents and
# pull requests write. GITHUB_TOKEN can't do it: this repository does not let
# Actions open pull requests, and a push or PR made with it starts no CI, so the
# required checks would never report. Without the secret only the issue is filed.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: release-followup
  cancel-in-progress: false

jobs:
  check:
    name: Has the repository caught up
    # A dispatched Release run only publishes to ClawHub and runs on a branch,
    # not a tag, so there is nothing to catch up on after it.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # A step's `if` can't read secrets, so the catch-up step reads this.
      HAS_PIN_TOKEN: ${{ secrets.RELEASE_PIN_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_PIN_TOKEN || github.token }}
          # The manifest check asks GitHub for the newest release and the drift
          # check asks npm; neither needs history, but the tags cost nothing and
          # a future check may want them.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Read what is behind
        id: behind
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The tag the release ran on, for the command the issue prints.
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          left=""
          if ! out=$(go run ./scripts/pinmanifests -check 2>&1); then
            left="${left}- the Windows manifests and plugin files: \`go run ./scripts/pinmanifests -version ${VERSION#v} -checksums <checksums.txt from the release>\`"$'\n'"  \`\`\`"$'\n'"  ${out}"$'\n'"  \`\`\`"$'\n'
          fi
          # --after waits for npm to serve the release before deciding: this step
          # ran at 13:59:05 after 0.20.2 while the two packages landed at 14:01:54
          # and 14:02:50, so it asked a registry that had not caught up and said
          # the repository was fine (#3776).
          if ! out=$(node scripts/extension-drift.mjs --after "${VERSION#v}" 2>&1); then
            left="${left}- the published extension versions: \`node scripts/extension-drift.mjs --write\`"$'\n'"  \`\`\`"$'\n'"  ${out}"$'\n'"  \`\`\`"$'\n'
          fi
          # A flag rather than the emptiness of the block below: a heredoc
          # output ends in a newline either way, and an issue per release is
          # the wrong thing to bet on trimming.
          if [ -n "$left" ]; then
            echo "behind=yes" >>"$GITHUB_OUTPUT"
          else
            echo "behind=no" >>"$GITHUB_OUTPUT"
          fi
          {
            echo "left<<LEFT_EOF"
            printf '%s' "$left"
            echo
            echo LEFT_EOF
          } >>"$GITHUB_OUTPUT"

      - name: File or update the reminder
        id: issue
        if: steps.behind.outputs.behind == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          LEFT: ${{ steps.behind.outputs.left }}
        run: |
          set -euo pipefail
          body="${VERSION} is published — [the run](${RUN_URL}) — and the repository has not caught up:"$'\n\n'"${LEFT}"$'\n'"Until it does, \`pinmanifests -check\` fails on every pull request, and the extension versions in this repository say a number npm does not serve."
          existing=$(gh issue list --repo "$REPO" --state open --label release-followup \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing"
            echo "number=$existing" >>"$GITHUB_OUTPUT"
          else
            url=$(gh issue create --repo "$REPO" --label release-followup \
              --title "the repository has not caught up to the release" --body "$body")
            echo "$url"
            echo "number=${url##*/}" >>"$GITHUB_OUTPUT"
          fi

      - name: Catch up in a pull request
        if: steps.behind.outputs.behind == 'yes' && env.HAS_PIN_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PIN_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          gh release download "$VERSION" --repo "$REPO" --pattern checksums.txt --dir "$RUNNER_TEMP/rel"
          go run ./scripts/pinmanifests -version "$v" -checksums "$RUNNER_TEMP/rel/checksums.txt"
          # The step above already waited for npm with --after.
          node scripts/extension-drift.mjs --write
          go run ./scripts/pinmanifests -check
          node scripts/extension-drift.mjs
          if git diff --quiet; then
            echo "nothing to catch up"
            exit 0
          fi
          branch="chore/pin-$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore: pin the manifests to $v"
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore: pin the manifests to $v" \
            --body "Checksums from the ${VERSION} release, extension versions as npm serves them."$'\n\n'"Fixes #${ISSUE}"
