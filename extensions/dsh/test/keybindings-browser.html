<!doctype html>
<meta charset="utf-8">
<title>Deja keybinding settings fixture</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<div id="settings"></div><pre id="report">Loading</pre>
<script>window.__ModuleLoader__ = { load: (r) => { window.registration = r; } };</script>
<script src="../client.js"></script>
<script>
// Synthetic service for DOM interactions only. Real DSH registry/persistence
// integration is checked separately; this never changes a user's keybindings.
const mod = registration.factory((name) => ({ react: React, 'react-dom': ReactDOM })[name]);
const store = (initial) => {
  let value = initial;
  const listeners = new Set();
  return { getSnapshot: () => value, subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn); }, set(next) { value = next; for (const fn of listeners) fn(); } };
};
const ids = ['deja.search-session', 'deja.search-sessions', 'session.search'];
const defaults = ['KeyF', 'KeyK', 'KeyK'].map((code, i) => ({ code, modifiers: i === 1 ? ['control', 'alt'] : ['control'] }));
const catalog = store(ids.map((id, i) => ({ id, label: id, binding: defaults[i], keys: ['Ctrl', ...(i === 1 ? ['Alt'] : []), defaults[i].code.slice(3)] })));
const config = store({ status: 'ready', revision: '0' });
const edits = [], protections = [];
const shortcuts = {
  catalog, config,
  recording: async (active) => { protections.push(active); },
  describeBinding(binding) {
    const conflicts = catalog.getSnapshot().filter((row) => row.binding && row.binding.code === binding.code && row.binding.modifiers.join() === binding.modifiers.join()).map((row) => row.id);
    return { binding, keys: [...binding.modifiers, binding.code.replace('Key', '')], issue: null, conflicts };
  },
  async edit(operation, revision) {
    if (revision !== config.getSnapshot().revision) return { status: 'stale' };
    edits.push(operation);
    const binding = operation.type === 'reset' ? defaults[ids.indexOf(operation.id)] : operation.binding;
    catalog.set(catalog.getSnapshot().map((row) => row.id === operation.id ? { ...row, binding, keys: binding ? [...binding.modifiers, binding.code.replace('Key', '')] : [] } : row));
    config.set({ status: 'ready', revision: String(Number(revision) + 1) });
    return { status: 'saved' };
  },
};
const prefs = mod.preferences();
// Declare a working route so all three shortcut rows render; this fixture
// only inspects the recorder, it never writes a real binding.
mod.searchRoute().set("present");
ReactDOM.createRoot(document.getElementById('settings')).render(React.createElement(mod.Settings, { prefs, shortcuts, route: mod.searchRoute() }));
window.fixture = { catalog, config, edits, protections };
document.getElementById('report').textContent = 'Ready';
</script>
