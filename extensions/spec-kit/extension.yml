schema_version: "1.0"

extension:
  id: "deja-vu"
  name: "deja-vu session recall"
  # Pinned to the deja release by scripts/pinmanifests; the release packs this
  # file into deja-spec-kit.zip after the pin, so the zip says its own release.
  version: "0.23.0"
  description: "Searches your past coding-agent sessions for a feature: what was tried, decided or failed."
  author: "Vladislav Shulcz (@vshulcz)"
  repository: "https://github.com/vshulcz/deja-vu"
  license: "MIT"
  homepage: "https://vshulcz.github.io/deja-vu/"

requires:
  speckit_version: ">=0.10.0"
  tools:
    - name: "deja"
      version: ">=0.22.0"
      required: true

provides:
  commands:
    - name: "speckit.deja-vu.recall"
      file: "commands/recall.md"
      description: "Search past agent sessions for this feature: what was tried, decided or failed, and which files it touched. Read-only."

# Optional: the agent offers it and the user decides. Nothing runs on its own.
hooks:
  before_implement:
    command: "speckit.deja-vu.recall"
    optional: true
    prompt: "Check past sessions for this feature before implementing?"
    description: "Searches past agent sessions with deja for earlier attempts at this feature. Read-only."

tags:
  - "memory"
  - "recall"
  - "history"
  - "context"
  - "local-first"
